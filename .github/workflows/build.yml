
name: Build Chicken Zone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Check Flutter
        run: flutter --version

      - name: Build APK
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "Flutter project files are missing!"
            exit 1
          fi
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chicken-Zone-APK
          path: build/app/outputs/flutter-apk/app-release.apk
