
name: Build Chicken Zone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Create Android Project
        run: |
          flutter create --platforms android --project-name chicken_zone --org com.chickenzone temp_project
          cp -r temp_project/android ./android

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Chicken Zone App Icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chicken-Zone-APK
          path: build/app/outputs/flutter-apk/app-release.apk
